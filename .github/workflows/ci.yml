name: CI

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker login only when deployment enabled
      - name: Login to Docker Hub
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # Backend Image Build & Push
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ vars.DEPLOY_ENABLED == 'true' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:latest

      # Frontend Image Build & Push
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ vars.DEPLOY_ENABLED == 'true' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:latest 
